<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Purple gradient background with rounded corners -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Dice face (white rounded square) -->
  <rect x="88" y="88" width="336" height="336" rx="64" fill="white" opacity="0.95"/>
  <!-- 5-dot pattern (standard die face for 5) -->
  <circle cx="174" cy="174" r="30" fill="#7C3AED"/>
  <circle cx="338" cy="174" r="30" fill="#7C3AED"/>
  <circle cx="256" cy="256" r="30" fill="#7C3AED"/>
  <circle cx="174" cy="338" r="30" fill="#7C3AED"/>
  <circle cx="338" cy="338" r="30" fill="#7C3AED"/>
</svg>
